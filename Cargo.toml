[package]
name = "petitcarnets"
version = "0.0.8"
edition = "2024"
rust-version = "1.85"
description = "Terminal user interfaces in the Elm architecture (model, update, view), with no dependencies."
authors = ["Sebastien Rousseau"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastienrousseau/petitcarnets"
homepage = "https://petitcarnets.com"
documentation = "https://docs.rs/petitcarnets"
readme = "README.md"
keywords = ["tui", "terminal", "elm", "cli", "ui"]
categories = ["command-line-interface", "gui"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/fixtures/color.tsv",
    "tests/fixtures/input.tsv",
    "tests/fixtures/width.tsv",
    "tests/fixtures/bubbles.tsv",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# The components (Bubbles), on by default; they add no dependencies.
[features]
default = ["bubbles"]
bubbles = []

# The examples of the components, and their tests, need them.
[[example]]
name = "textinput"
required-features = ["bubbles"]

[[example]]
name = "textinputs"
required-features = ["bubbles"]

[[example]]
name = "textarea"
required-features = ["bubbles"]

[[example]]
name = "spinners"
required-features = ["bubbles"]

[[example]]
name = "list-simple"
required-features = ["bubbles"]

[[example]]
name = "list-default"
required-features = ["bubbles"]

[[example]]
name = "pager"
required-features = ["bubbles"]

[[example]]
name = "progress-static"
required-features = ["bubbles"]

[[example]]
name = "progress-animated"
required-features = ["bubbles"]

[[example]]
name = "table"
required-features = ["bubbles"]

[[example]]
name = "help"
required-features = ["bubbles"]

[[example]]
name = "timer"
required-features = ["bubbles"]

[[example]]
name = "stopwatch"
required-features = ["bubbles"]

[[example]]
name = "paginator"
required-features = ["bubbles"]

[[example]]
name = "chat"
required-features = ["bubbles"]

[[example]]
name = "send-msg"
required-features = ["bubbles"]

[[example]]
name = "realtime"
required-features = ["bubbles"]

[[example]]
name = "prevent-quit"
required-features = ["bubbles"]

[[example]]
name = "composable-views"
required-features = ["bubbles"]

[[example]]
name = "split-editors"
required-features = ["bubbles"]

[[example]]
name = "set-terminal-color"
required-features = ["bubbles"]

[[test]]
name = "bubbles"
required-features = ["bubbles"]

[[test]]
name = "bubbles_examples"
required-features = ["bubbles"]

# No dependencies, by design: the terminal is driven through a few libc
# functions declared in src/sys.rs.
[dependencies]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_results = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
